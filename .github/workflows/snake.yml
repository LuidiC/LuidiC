name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: LuidiC
          outputs: |
            dist/github-snake.svg?color_snake=64ffda&color_dots=#0d1117,#112240,#1a4a7a,#2563ab,#64ffda
            dist/github-snake-dark.svg?color_snake=64ffda&color_dots=#0d1117,#112240,#1a4a7a,#2563ab,#64ffda

      - name: Push output to branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
